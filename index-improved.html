<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Royal Crete - Manufacturing ERP</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback, useEffect } = React;

    // ============ LOCAL STORAGE PERSISTENCE ============
    const useLocalStorage = (key, initialValue) => {
      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (error) {
          console.error('Error reading localStorage:', error);
          return initialValue;
        }
      });

      const setValue = (value) => {
        try {
          const valueToStore = value instanceof Function ? value(storedValue) : value;
          setStoredValue(valueToStore);
          window.localStorage.setItem(key, JSON.stringify(valueToStore));
        } catch (error) {
          console.error('Error writing to localStorage:', error);
        }
      };

      return [storedValue, setValue];
    };

    // ============ SHARED UI COMPONENTS ============
    function Button({ children, onClick, variant = "primary", type = "button", className = "", disabled = false }) {
      const baseStyle = "px-4 py-2 rounded text-sm font-medium transition focus:outline-none focus:ring-2 focus:ring-offset-1 disabled:opacity-50 disabled:cursor-not-allowed";
      const variants = {
        primary: "bg-indigo-600 hover:bg-indigo-700 text-white focus:ring-indigo-500",
        secondary: "bg-slate-200 hover:bg-slate-300 text-slate-700 focus:ring-slate-400",
        success: "bg-emerald-600 hover:bg-emerald-700 text-white focus:ring-emerald-500",
        danger: "bg-rose-600 hover:bg-rose-700 text-white focus:ring-rose-500",
        warning: "bg-amber-600 hover:bg-amber-700 text-white focus:ring-amber-500",
      };
      return (
        <button type={type} onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant] || variants.primary} ${className}`}>
          {children}
        </button>
      );
    }

    function Input({ label, value, onChange, type = "text", placeholder = "", required = false, step, min, max, readonly = false }) {
      return (
        <div className="flex flex-col gap-1 w-full">
          {label && <label className="text-xs font-semibold text-slate-600 uppercase">{label}</label>}
          <input
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            required={required}
            step={step}
            min={min}
            max={max}
            readOnly={readonly}
            className="px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:border-indigo-500 w-full disabled:bg-slate-100"
          />
        </div>
      );
    }

    function Select({ label, value, onChange, options, required = false }) {
      return (
        <div className="flex flex-col gap-1 w-full">
          {label && <label className="text-xs font-semibold text-slate-600 uppercase">{label}</label>}
          <select value={value} onChange={onChange} required={required} className="px-3 py-2 border border-slate-300 rounded text-sm bg-white focus:outline-none focus:border-indigo-500">
            <option value="">-- Select --</option>
            {options.map(opt => (
              <option key={opt.id} value={opt.id}>{opt.label}</option>
            ))}
          </select>
        </div>
      );
    }

    function DataTable({ title, columns, data, onRowClick, actions }) {
      const [searchTerm, setSearchTerm] = useState("");
      const [currentPage, setCurrentPage] = useState(1);
      const itemsPerPage = 10;

      const filteredData = data.filter(row =>
        columns.some(col =>
          String(row[col.key]).toLowerCase().includes(searchTerm.toLowerCase())
        )
      );

      const totalPages = Math.ceil(filteredData.length / itemsPerPage);
      const paginatedData = filteredData.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

      return (
        <div className="bg-white rounded border border-slate-200 shadow-sm overflow-hidden">
          {title && (
            <div className="px-4 py-3 bg-slate-50 border-b border-slate-200 font-bold text-slate-700 flex justify-between items-center">
              <span>{title}</span>
              <input
                type="text"
                placeholder="Search..."
                value={searchTerm}
                onChange={(e) => { setSearchTerm(e.target.value); setCurrentPage(1); }}
                className="px-2 py-1 border border-slate-300 rounded text-xs w-48"
              />
            </div>
          )}
          <div className="overflow-x-auto max-h-[600px]">
            <table className="w-full text-left text-sm text-slate-600">
              <thead className="bg-slate-100 text-slate-700 uppercase text-xs sticky top-0 z-10">
                <tr>
                  {columns.map((col) => (
                    <th key={col.key} className="px-3 py-3 font-semibold bg-slate-100 whitespace-nowrap">{col.label}</th>
                  ))}
                  {actions && <th className="px-3 py-3 font-semibold">Actions</th>}
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-200">
                {paginatedData.length === 0 ? (
                  <tr>
                    <td colSpan={columns.length + (actions ? 1 : 0)} className="px-4 py-4 text-center text-slate-400">No records found.</td>
                  </tr>
                ) : (
                  paginatedData.map((row, idx) => (
                    <tr key={row.id || idx} className={`hover:bg-slate-50 cursor-pointer ${row.isTotal ? 'bg-indigo-50 font-bold' : ''}`} onClick={() => onRowClick?.(row)}>
                      {columns.map((col) => (
                        <td key={col.key} className="px-3 py-2.5 whitespace-nowrap">{row[col.key]}</td>
                      ))}
                      {actions && (
                        <td className="px-3 py-2.5">
                          <div className="flex gap-2">
                            {actions.map((action) => (
                              <Button key={action.id} variant="secondary" onClick={() => action.onClick(row)} className="px-2 py-1 text-xs">
                                {action.label}
                              </Button>
                            ))}
                          </div>
                        </td>
                      )}
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>
          {totalPages > 1 && (
            <div className="px-4 py-3 bg-slate-50 border-t border-slate-200 flex justify-between items-center text-xs">
              <span>Page {currentPage} of {totalPages}</span>
              <div className="flex gap-2">
                <Button variant="secondary" onClick={() => setCurrentPage(Math.max(1, currentPage - 1))} disabled={currentPage === 1}>Prev</Button>
                <Button variant="secondary" onClick={() => setCurrentPage(Math.min(totalPages, currentPage + 1))} disabled={currentPage === totalPages}>Next</Button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============ AUTHENTICATION ============
    function useAuth() {
      const [auth, setAuth] = useLocalStorage('auth', {
        token: null,
        role: "Admin",
        fullName: "Farrakh Muneer",
      });

      const login = (role, fullName) => setAuth({ token: "demo-token", role, fullName });
      const logout = () => setAuth({ token: null, role: "", fullName: "" });

      return { ...auth, login, logout };
    }

    function LoginScreen({ onLogin }) {
      const [name, setName] = useState("Farrakh Muneer");
      const [role, setRole] = useState("Admin");

      const handleSubmit = (e) => {
        e.preventDefault();
        onLogin(role, name);
      };

      return (
        <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 to-slate-800">
          <form onSubmit={handleSubmit} className="bg-white p-8 rounded-lg shadow-2xl w-96 space-y-6">
            <div className="text-center">
              <h1 className="text-3xl font-bold text-indigo-600">🏭 Royal Crete</h1>
              <p className="text-sm text-slate-500 mt-1">Manufacturing ERP System</p>
            </div>

            <Input label="Full Name" value={name} onChange={(e) => setName(e.target.value)} required />

            <div className="flex flex-col gap-1">
              <label className="text-xs font-semibold text-slate-600 uppercase">Role</label>
              <select value={role} onChange={(e) => setRole(e.target.value)} className="px-3 py-2 border border-slate-300 rounded text-sm bg-white focus:outline-none focus:border-indigo-500">
                <option value="Admin">Admin</option>
                <option value="Production Manager">Production Manager</option>
                <option value="Store Keeper">Store Keeper</option>
                <option value="Procurement Officer">Procurement Officer</option>
                <option value="Sales Manager">Sales Manager</option>
                <option value="Accountant">Accountant</option>
              </select>
            </div>

            <Button type="submit" className="w-full">Sign In</Button>

            <p className="text-xs text-slate-500 text-center">Demo credentials - all roles available</p>
          </form>
        </div>
      );
    }

    // ============ MASTER DATA & CATALOGS ============
    const initialProducts = [
      { id: 101, name: "Kerb Stone (K4) 2000 PSI", category: "Kerb", unit: "RFT", wasteFactor: 1.05, laborCost: 150 },
      { id: 102, name: "Paver Tile (Gray) 5000 PSI, 80mm", category: "Paver", unit: "SFT", wasteFactor: 1.08, laborCost: 120 },
      { id: 103, name: "Hollow Block 4\" x 8\" x 16\"", category: "Block", unit: "Nos", wasteFactor: 1.10, laborCost: 80 },
      { id: 104, name: "RCC Pipe 6\", 8 feet", category: "Pipe", unit: "RFT", wasteFactor: 1.03, laborCost: 200 },
      { id: 105, name: "Girder 6'", category: "Girder", unit: "RFT", wasteFactor: 1.02, laborCost: 250 },
    ];

    const initialBOM = [
      { id: 1, productId: 101, materialId: "RM-1", qty: 0.2, notes: "Cement for Kerb" },
      { id: 2, productId: 101, materialId: "RM-2", qty: 0.1, notes: "Sand for Kerb" },
      { id: 3, productId: 102, materialId: "RM-1", qty: 0.15, notes: "Cement for Paver" },
      { id: 4, productId: 102, materialId: "RM-3", qty: 0.08, notes: "Aggregate for Paver" },
    ];

    const initialRawMaterials = [
      { id: "RM-1", name: "Cement", unit: "Bags", stock: 1384, minStock: 500, costPerUnit: 1450, supplier: "S-1" },
      { id: "RM-2", name: "Sand", unit: "Tons", stock: 5704, minStock: 1000, costPerUnit: 1200, supplier: "S-2" },
      { id: "RM-3", name: "Pan Crush", unit: "Tons", stock: 5487, minStock: 1000, costPerUnit: 2300, supplier: "S-3" },
      { id: "RM-4", name: "Steel", unit: "Kg", stock: 1552, minStock: 500, costPerUnit: 260, supplier: "S-4" },
    ];

    // ============ PRODUCTION MODULE ============
    function ProductionModule({ products, bom, rawMaterials, productionRecords, setProductionRecords }) {
      const [formData, setFormData] = useState({
        date: new Date().toISOString().split('T')[0],
        shift: "Morning",
        batch: "",
        productId: products[0]?.id || "",
        quantityPlanned: "",
        quantityProduced: "",
        status: "Completed",
        notes: ""
      });
      const [message, setMessage] = useState("");

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.batch || !formData.quantityProduced || !formData.productId) {
          setMessage("❌ Please fill all required fields");
          return;
        }

        const product = products.find(p => p.id === parseInt(formData.productId));
        const newRecord = {
          id: productionRecords.length + 1,
          ...formData,
          productId: parseInt(formData.productId),
          productName: product?.name || "Unknown",
          quantityProduced: parseFloat(formData.quantityProduced),
          quantityPlanned: parseFloat(formData.quantityPlanned) || parseFloat(formData.quantityProduced),
          timestamp: new Date().toISOString()
        };

        setProductionRecords([...productionRecords, newRecord]);
        setMessage(`✅ Production recorded: ${formData.quantityProduced} ${product?.unit} of ${product?.name}`);
        
        setFormData({
          date: new Date().toISOString().split('T')[0],
          shift: "Morning",
          batch: "",
          productId: products[0]?.id || "",
          quantityPlanned: "",
          quantityProduced: "",
          status: "Completed",
          notes: ""
        });

        setTimeout(() => setMessage(""), 4000);
      };

      const tableData = productionRecords.map(record => ({
        ...record,
        efficiency: ((record.quantityProduced / record.quantityPlanned) * 100).toFixed(1) + "%"
      }));

      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold text-slate-800">🏭 Daily Production</h2>
            <div className="text-sm text-slate-500">Total Batches: {productionRecords.length}</div>
          </div>

          {message && (
            <div className={`p-4 rounded border ${message.includes('✅') ? 'bg-emerald-100 border-emerald-300 text-emerald-800' : 'bg-rose-100 border-rose-300 text-rose-800'}`}>
              {message}
            </div>
          )}

          <form onSubmit={handleSubmit} className="bg-white p-6 rounded-lg border border-slate-200 shadow-sm space-y-4">
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
              <Input label="Production Date" type="date" value={formData.date} onChange={(e) => setFormData({ ...formData, date: e.target.value })} required />
              <Select label="Shift" value={formData.shift} onChange={(e) => setFormData({ ...formData, shift: e.target.value })} options={[
                { id: "Morning", label: "Morning" },
                { id: "Evening", label: "Evening" },
                { id: "Night", label: "Night" }
              ]} />
              <Input label="Batch #" placeholder="BATCH-001" value={formData.batch} onChange={(e) => setFormData({ ...formData, batch: e.target.value })} required />
              <Select label="Product" value={formData.productId} onChange={(e) => setFormData({ ...formData, productId: e.target.value })} options={products.map(p => ({ id: p.id, label: p.name }))} required />
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
              <Input label="Qty Planned" type="number" step="0.01" value={formData.quantityPlanned} onChange={(e) => setFormData({ ...formData, quantityPlanned: e.target.value })} />
              <Input label="Qty Produced" type="number" step="0.01" value={formData.quantityProduced} onChange={(e) => setFormData({ ...formData, quantityProduced: e.target.value })} required />
              <Select label="Status" value={formData.status} onChange={(e) => setFormData({ ...formData, status: e.target.value })} options={[
                { id: "Completed", label: "Completed" },
                { id: "In Progress", label: "In Progress" },
                { id: "On Hold", label: "On Hold" },
                { id: "Rejected", label: "Rejected / QC Fail" }
              ]} />
              <Button type="submit" variant="success" className="h-10 mt-5">Submit Production</Button>
            </div>

            <Input label="Notes" value={formData.notes} onChange={(e) => setFormData({ ...formData, notes: e.target.value })} placeholder="Any remarks about the production..." />
          </form>

          <DataTable title="Production Log" columns={[
            { key: "date", label: "Date" },
            { key: "shift", label: "Shift" },
            { key: "batch", label: "Batch #" },
            { key: "productName", label: "Product" },
            { key: "quantityProduced", label: "Qty Produced" },
            { key: "status", label: "Status" },
            { key: "efficiency", label: "Efficiency" }
          ]} data={tableData} />
        </div>
      );
    }

    // ============ STORE MODULE ============
    function StoreModule({ products, rawMaterials, productionRecords, salesOrders, bom }) {
      const [storeTab, setStoreTab] = useState("finished");

      const finishedGoodsData = products.map(product => {
        const produced = productionRecords.filter(r => r.productId === product.id && r.status === "Completed")
          .reduce((sum, r) => sum + r.quantityProduced, 0);
        const sold = salesOrders.filter(s => s.productId === product.id).reduce((sum, s) => sum + s.quantity, 0);

        return {
          id: product.id,
          name: product.name,
          produced: produced.toFixed(2),
          sold: sold.toFixed(2),
          available: (produced - sold).toFixed(2),
          unit: product.unit,
          value: "Rs " + ((produced - sold) * 5000).toLocaleString()
        };
      });

      const rawMaterialsData = rawMaterials.map(rm => ({
        ...rm,
        status: rm.stock <= rm.minStock ? "🔴 Low Stock" : "🟢 OK",
        stockFormatted: rm.stock + " " + rm.unit,
        totalValue: "Rs " + (rm.stock * rm.costPerUnit).toLocaleString()
      }));

      return (
        <div className="space-y-6">
          <h2 className="text-2xl font-bold text-slate-800">📦 Store Inventory</h2>

          <div className="flex gap-2 border-b border-slate-200 pb-2">
            <button onClick={() => setStoreTab("finished")} className={`px-4 py-2 text-sm font-semibold rounded transition ${storeTab === 'finished' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border'}`}>
              Finished Goods ({products.length})
            </button>
            <button onClick={() => setStoreTab("raw")} className={`px-4 py-2 text-sm font-semibold rounded transition ${storeTab === 'raw' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border'}`}>
              Raw Materials ({rawMaterials.length})
            </button>
          </div>

          {storeTab === "finished" && (
            <DataTable title="Finished Goods Inventory" columns={[
              { key: "id", label: "Code" },
              { key: "name", label: "Product" },
              { key: "produced", label: "Produced" },
              { key: "sold", label: "Sold" },
              { key: "available", label: "Available" },
              { key: "unit", label: "Unit" },
              { key: "value", label: "Stock Value" }
            ]} data={finishedGoodsData} />
          )}

          {storeTab === "raw" && (
            <DataTable title="Raw Materials Inventory" columns={[
              { key: "id", label: "Code" },
              { key: "name", label: "Material" },
              { key: "stockFormatted", label: "Stock" },
              { key: "status", label: "Status" },
              { key: "costPerUnit", label: "Cost/Unit" },
              { key: "totalValue", label: "Total Value" }
            ]} data={rawMaterialsData} />
          )}
        </div>
      );
    }

    // ============ MAIN APP ============
    function App() {
      const { token, role, fullName, login, logout } = useAuth();
      const [activeTab, setActiveTab] = useState("dashboard");

      const [products] = useState(initialProducts);
      const [bom] = useState(initialBOM);
      const [rawMaterials] = useState(initialRawMaterials);
      const [productionRecords, setProductionRecords] = useLocalStorage('productionRecords', []);
      const [salesOrders, setSalesOrders] = useLocalStorage('salesOrders', []);
      const [purchases, setPurchases] = useLocalStorage('purchases', []);

      if (!token) return <LoginScreen onLogin={login} />;

      const tabs = [
        { id: "dashboard", label: "📊 Dashboard", icon: "📊" },
        { id: "production", label: "🏭 Production" },
        { id: "store", label: "📦 Store" },
        { id: "procurement", label: "🛒 Procurement" },
        { id: "sales", label: "💰 Sales" },
        { id: "accounts", label: "📊 Accounts" },
        { id: "settings", label: "⚙️ Settings" },
      ];

      const productionToday = productionRecords.filter(r => r.date === new Date().toISOString().split('T')[0]).length;
      const totalProduced = productionRecords.filter(r => r.status === "Completed").reduce((sum, r) => sum + r.quantityProduced, 0);

      return (
        <div className="min-h-screen flex flex-col bg-slate-100">
          <header className="bg-gradient-to-r from-slate-900 to-indigo-900 text-white px-6 py-4 flex justify-between items-center shadow-lg">
            <div className="flex items-center gap-3">
              <span className="font-bold text-2xl text-indigo-300">🏭 Royal Crete ERP</span>
              <span className="text-xs bg-indigo-700 text-indigo-200 px-3 py-1 rounded-full border border-indigo-500 uppercase font-semibold">{role}</span>
            </div>
            <div className="flex items-center gap-4 text-sm">
              <span className="text-slate-300">👤 {fullName}</span>
              <Button onClick={logout} variant="danger" className="text-xs">Sign Out</Button>
            </div>
          </header>

          <nav className="bg-white border-b border-slate-300 px-6 flex gap-1 overflow-x-auto shadow-sm">
            {tabs.map((tab) => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-4 py-3 text-sm font-medium border-b-2 transition whitespace-nowrap ${
                  activeTab === tab.id 
                    ? "border-indigo-600 text-indigo-600 bg-indigo-50" 
                    : "border-transparent text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                }`}
              >
                {tab.label}
              </button>
            ))}
          </nav>

          <main className="p-6 flex-1 max-w-7xl mx-auto w-full">
            {activeTab === "dashboard" && (
              <div className="space-y-6">
                <h1 className="text-3xl font-bold text-slate-800">Dashboard Overview</h1>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-gradient-to-br from-indigo-500 to-indigo-600 text-white p-6 rounded-lg shadow-lg">
                    <p className="text-4xl font-bold">{productionToday}</p>
                    <p className="text-sm opacity-90">Batches Today</p>
                  </div>
                  <div className="bg-gradient-to-br from-emerald-500 to-emerald-600 text-white p-6 rounded-lg shadow-lg">
                    <p className="text-4xl font-bold">{totalProduced.toFixed(0)}</p>
                    <p className="text-sm opacity-90">Total Produced</p>
                  </div>
                  <div className="bg-gradient-to-br from-orange-500 to-orange-600 text-white p-6 rounded-lg shadow-lg">
                    <p className="text-4xl font-bold">{salesOrders.length}</p>
                    <p className="text-sm opacity-90">Pending Sales Orders</p>
                  </div>
                  <div className="bg-gradient-to-br from-purple-500 to-purple-600 text-white p-6 rounded-lg shadow-lg">
                    <p className="text-4xl font-bold">Rs 2.5M</p>
                    <p className="text-sm opacity-90">Cash Balance</p>
                  </div>
                </div>
              </div>
            )}

            {activeTab === "production" && <ProductionModule products={products} bom={bom} rawMaterials={rawMaterials} productionRecords={productionRecords} setProductionRecords={setProductionRecords} />}

            {activeTab === "store" && <StoreModule products={products} rawMaterials={rawMaterials} productionRecords={productionRecords} salesOrders={salesOrders} bom={bom} />}

            {activeTab === "procurement" && <div className="bg-white p-8 rounded text-center text-slate-500"><p>Procurement module - coming soon</p></div>}
            {activeTab === "sales" && <div className="bg-white p-8 rounded text-center text-slate-500"><p>Sales module - coming soon</p></div>}
            {activeTab === "accounts" && <div className="bg-white p-8 rounded text-center text-slate-500"><p>Accounts module - coming soon</p></div>}
            {activeTab === "settings" && <div className="bg-white p-8 rounded text-center text-slate-500"><p>Settings - coming soon</p></div>}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
